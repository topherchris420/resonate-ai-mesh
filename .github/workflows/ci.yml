name: CI

# Every job runs without credentials or network access to judgment providers.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  evidence:
    name: Replay, determinism, independent verification, demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --locked -p mesh-lab
      - name: Golden recordings replay exactly
        run: ./target/release/mesh golden verify
      - name: The canonical run is identical twice
        run: make determinism
      - name: Every committed bundle verifies independently, and the cockpit export replays
        run: make verify-exports
      - name: The demo runs with no keys and no network
        run: ./target/release/mesh demo --root . --artifacts "$RUNNER_TEMP/demo" > "$RUNNER_TEMP/demo.txt" && grep -q "REPLAY VERIFIED" "$RUNNER_TEMP/demo.txt"
      - name: Claims are consistent with the committed evidence
        run: ./target/release/mesh claims check --artifacts apps/c2-dashboard/public/demo

  python:
    name: Python (verifier, contracts, pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Protobuf definitions compile
        run: bash scripts/generate-proto.sh "$RUNNER_TEMP/proto"

  web:
    name: Cockpit (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter c2-dashboard lint
      - run: pnpm --filter c2-dashboard typecheck
      - run: pnpm --filter @pordenone/shared-types exec tsc --noEmit -p .
      - run: pnpm --filter c2-dashboard test
      - run: pnpm --filter c2-dashboard build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: MESH_API_TOKEN=ci docker compose build
