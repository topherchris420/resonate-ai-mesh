# The mesh server, the research cockpit, and a simulated human-state source.
#
#   MESH_API_TOKEN=$(openssl rand -hex 24) docker compose up --build
#   open http://localhost:3000   (enter the same token when the cockpit asks)
#
# The server binds 0.0.0.0 inside its container, so a token is required. Ports
# are published on 127.0.0.1 only. Nothing here needs judgment credentials.
services:
  mesh:
    build: { context: ., dockerfile: docker/Dockerfile.mesh }
    command: ["mesh", "serve", "--bind", "0.0.0.0:7878", "--allow-origin", "http://localhost:3000", "--allow-origin", "http://127.0.0.1:3000"]
    environment:
      MESH_API_TOKEN: ${MESH_API_TOKEN:?set MESH_API_TOKEN}
      MESH_LOG: info
    ports: ["127.0.0.1:7878:7878"]
    volumes: ["mesh-artifacts:/mesh/artifacts"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  cockpit:
    build:
      context: .
      dockerfile: docker/Dockerfile.c2-dashboard
      args: { NEXT_PUBLIC_MESH_URL: "http://localhost:7878" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { mesh: { condition: service_healthy } }

  biometric-pipeline:
    build: { context: ., dockerfile: docker/Dockerfile.biometric-pipeline }
    environment:
      MESH_INGEST_URL: ws://mesh:7878/ingest
      MESH_API_TOKEN: ${MESH_API_TOKEN:?set MESH_API_TOKEN}
      MODE: SIMULATED
      SAMPLE_RATE_HZ: "4"
    depends_on: { mesh: { condition: service_healthy } }
    restart: on-failure

volumes:
  mesh-artifacts:
