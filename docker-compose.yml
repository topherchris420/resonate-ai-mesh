version: '3.8'

services:
  kernel:
    build:
      context: .
      dockerfile: docker/Dockerfile.kernel
    ports:
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - BIND_ADDR=0.0.0.0:50051
      - JUDGMENT_ENABLED=false
      - JUDGMENT_PROVIDER=disabled
      - JUDGMENT_MODEL=jev-latest
      - JUDGMENT_TIMEOUT_MS=10000
      - JUDGMENT_MINIMUM_CONFIDENCE=0.70
      - JUDGMENT_POLICY_VERSION=pordenone.judgment.policy.v1

  telemetry-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.telemetry-bridge
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - WS_BIND_ADDR=0.0.0.0:8080
      - KERNEL_ADDR=http://kernel:50051
    depends_on:
      - kernel

  biometric-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.biometric-pipeline
    environment:
      - TELEMETRY_BRIDGE_WS=ws://telemetry-bridge:8080/ingest
      - MODE=SIMULATED
      - SAMPLE_RATE_HZ=10
    depends_on:
      - telemetry-bridge

  sim-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SEED=42
      - TELEMETRY_BRIDGE_WS=ws://telemetry-bridge:8080/ingest
    depends_on:
      - telemetry-bridge

  c2-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.c2-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
      - NEXT_PUBLIC_SIM_ENGINE_URL=http://localhost:8000
    depends_on:
      - telemetry-bridge
      - sim-engine
