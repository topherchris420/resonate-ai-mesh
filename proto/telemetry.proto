syntax = "proto3";

package pordenone.telemetry;

// Where a value came from. The zero value is SIMULATED, so unlabeled data is
// never presented as live.
enum DataMode {
  SIMULATED = 0;
  LIVE = 1;
  REPLAY = 2;
}

enum SignalQuality {
  SIGNAL_QUALITY_UNSPECIFIED = 0;
  GOOD = 1;
  DEGRADED = 2;
  INVALID = 3;
  MISSING = 4;
}

// One human-state value (schemas/json/human-state-datum.json). Values are
// operational indices, not clinical or wellness measurements.
message HumanStateDatum {
  string metric = 1;               // e.g. operator_load_index
  double value = 2;
  string unit = 3;                 // e.g. index[0,1]
  int64 timestamp = 4;
  string source = 5;               // e.g. sim.operator_load.v1
  DataMode mode = 6;
  optional DataMode original_mode = 7;  // required for REPLAY, absent otherwise
  double confidence = 8;           // the source's own reliability estimate
  SignalQuality quality = 9;
}

// Payload of an adaptive_level event: how operator load changed kernel gating.
message AdaptiveLevelPayload {
  string level = 1;                // NORMAL, ELEVATED, HIGH, CRITICAL
  string previous_level = 2;
  optional double operator_load_index = 3;  // absent when the signal is unusable
  DataMode data_mode = 4;
  optional SignalQuality signal_quality = 5;
  bool signal_usable = 6;
  bool gating_enabled = 7;
  bool defer_background_tasks = 8;
}

// v1.0 operator telemetry. Superseded by HumanStateDatum, which carries a
// data mode and provenance per value; nothing in this repository emits it.
message OperatorStateTelemetry {
  option deprecated = true;
  string operator_id = 1;
  double cognitive_load = 2;
  double arousal = 3;
  double hrv = 4;
  double heart_rate = 5;
  double attention = 6;
  double stress = 7;
  double confidence = 8;
  int64 timestamp = 9;
  string sensor_provenance = 10;
  bool is_simulated = 11;
}

// v1.0 adaptive state. Superseded by AdaptiveLevelPayload; its stability and
// resonance fields had no operational definition.
message AdaptiveState {
  option deprecated = true;
  string state = 1;
  double stability = 2;
  double resonance = 3;
  double adaptation_rate = 4;
  double confidence = 5;
  int64 timestamp = 6;
}
