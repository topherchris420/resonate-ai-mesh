# Latency spike: the judgment stage slows down. Below the timeout the latency
# is only recorded; above it the judge times out and proposals are withheld.
id: latency-spike
description: Judgment latency rises to 4 s, then to 12 s (above the 10 s timeout).
ticks: 50
points_of_interest:
  - { id: goal, position: [60, 0] }
agents:
  - { id: l1, behavior: cautious, start: [-60, 5], goal: goal, speed: 3 }
  - { id: l2, behavior: cautious, start: [-60, -5], goal: goal, speed: 3 }
faults:
  - { kind: judge_latency, at_tick: 10, duration_ticks: 8, magnitude: 4000 }
  - { kind: judge_latency, at_tick: 25, duration_ticks: 8, magnitude: 12000 }
kernel:
  validator: { max_step: 8, min_separation: 3, max_stale_ms: 1500 }
  judgment: { provider: mock, profile: evidence_heuristic, timeout_ms: 10000 }
termination: { stop_when_all_goals_reached: false }
